<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="80%">
      <stop offset="0" stop-color="#4f8068"/>
      <stop offset="0.45" stop-color="#234a40"/>
      <stop offset="1" stop-color="#08130f"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbeec2"/>
      <stop offset="0.5" stop-color="#e9cd8e"/>
      <stop offset="1" stop-color="#b98748"/>
    </linearGradient>
    <linearGradient id="curl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6532"/>
      <stop offset="0.5" stop-color="#f3dfaa"/>
      <stop offset="1" stop-color="#c9a264"/>
    </linearGradient>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f0553f"/>
      <stop offset="0.45" stop-color="#b81d17"/>
      <stop offset="1" stop-color="#5c0808"/>
    </radialGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.24  0 0 0 0 0.08  -1.7 0 0 0 0.92" result="stain"/>
      <feComposite in="stain" in2="SourceAlpha" operator="in" result="stainIn"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="stainIn"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="7" dy="9" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="curlShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="sealShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#2a0d04" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Backdrop: dim jungle green, soft light from the upper left -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="40" cy="206" rx="46" ry="26" fill="#0d2a1f"/>
    <ellipse cx="226" cy="50" rx="40" ry="30" fill="#6fa17f"/>
    <ellipse cx="214" cy="214" rx="38" ry="30" fill="#10261f"/>
    <ellipse cx="36" cy="40" rx="34" ry="24" fill="#7fb08a"/>
  </g>
  <rect width="256" height="256" fill="url(#vignette)"/>

  <!-- The note -->
  <g transform="rotate(-8 128 128)" filter="url(#shadow)">
    <g filter="url(#grain)">
      <path id="sheet" fill="url(#paper)" stroke="#6e4a22" stroke-width="3" stroke-linejoin="round"
        d="M61 45 Q84 39 108 44 T156 41 T197 46
           Q203 80 198 112 T201 154
           L162 215
           Q140 220 110 214 T62 216
           Q55 182 60 150 T57 92 T61 45 Z"/>
    </g>
    <!-- Worn, darker edges -->
    <path fill="none" stroke="#8a5a26" stroke-width="9" stroke-opacity="0.28" stroke-linejoin="round"
      d="M65 50 Q84 45 108 49 T156 46 T193 51
         Q198 80 193 112 T196 152
         L159 210
         Q140 215 110 209 T66 211
         Q60 182 65 150 T62 92 T65 50 Z"/>

    <!-- Ink lines -->
    <g fill="none" stroke="#3d2614" stroke-width="6.5" stroke-linecap="round" opacity="0.88">
      <path d="M80 76 q13 -6 26 0 t26 0 t26 0 t22 -1"/>
      <path d="M79 100 q13 -6 26 0 t26 0 t26 0 t23 0"/>
      <path d="M80 124 q13 -6 26 0 t26 0 t26 0 t14 -1"/>
      <path d="M138 148 q8 -4 16 0"/>
    </g>

    <!-- Folded corner -->
    <path d="M201 154 Q180 168 156 170 Q162 194 162 215 Z" fill="#3a2208" opacity="0.38"
      transform="translate(-6 -5)" filter="url(#curlShadow)"/>
    <path d="M201 154 Q180 168 156 170 Q162 194 162 215 Z" fill="url(#curl)" stroke="#6e4a22"
      stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Wax seal -->
    <g filter="url(#sealShadow)">
      <path fill="url(#wax)" stroke="#4a0606" stroke-width="2"
        d="M104 150 Q118 147 127 157 Q138 165 135 179 Q136 194 123 201
           Q111 210 97 204 Q82 202 78 188 Q71 176 79 164 Q86 151 104 150 Z"/>
      <circle cx="106" cy="177" r="18" fill="none" stroke="#5c0808" stroke-width="2.5" opacity="0.75"/>
      <circle cx="106" cy="177" r="18" fill="none" stroke="#ff9a7c" stroke-width="1.2" opacity="0.45"
        transform="translate(-1 -1.2)"/>
      <!-- Rune pressed into the wax -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M97 188 L97 167 L115 188 L115 167" stroke="#4a0606" stroke-width="5"/>
        <path d="M97 188 L97 167 L115 188 L115 167" stroke="#ff8a6a" stroke-width="1.6" opacity="0.6"
          transform="translate(-1.3 -1.3)"/>
      </g>
      <ellipse cx="94" cy="162" rx="9" ry="4.5" fill="#ffd0bd" opacity="0.5" transform="rotate(-32 94 162)"/>
    </g>
  </g>

  <!-- Dark rim, like the edge of a game icon -->
  <rect x="2" y="2" width="252" height="252" fill="none" stroke="#000" stroke-width="5" stroke-opacity="0.7"/>
</svg>
